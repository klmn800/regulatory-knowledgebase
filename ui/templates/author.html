{% extends "base.html" %}

{% block content %}
<div class="author-page">

    <div class="author-header">
        <h2>OLG Author</h2>
        <p class="author-subtitle">Research, draft, and format OLG pages</p>
    </div>

    <div class="author-layout">

        <!-- Left: Assignment Form -->
        <div class="author-form-section">
            <div class="form-group">
                <label for="author-name">Assignment Name</label>
                <input type="text" id="author-name" name="name"
                       placeholder="e.g. vc1_scripts" autocomplete="off">
            </div>

            <div class="form-group">
                <label for="author-assignment">Assignment</label>
                <textarea id="author-assignment" name="assignment" rows="5"
                          placeholder="Describe what OLG content to create..."></textarea>
            </div>

            <div class="author-actions" style="margin-bottom: 0.75rem;">
                <button class="btn btn-outline btn-sm" onclick="authorSaveAssignment()">Save Assignment</button>
            </div>

            <!-- Phase tabs -->
            <div class="author-phase-tabs">
                <button class="phase-tab active" onclick="authorSwitchTab('research')" id="tab-research">Research</button>
                <button class="phase-tab" onclick="authorSwitchTab('drafts')" id="tab-drafts">Draft</button>
                <button class="phase-tab" onclick="authorSwitchTab('formats')" id="tab-formats">Format</button>
            </div>
        </div>

        <!-- Right: Existing Assignments -->
        <div class="author-assignments-section">
            <h3>Assignments</h3>
            <div id="assignments-list"
                 hx-get="/author/assignments"
                 hx-trigger="load"
                 hx-swap="innerHTML">
                <p class="text-muted">Loading...</p>
            </div>
        </div>

    </div>

    <!-- Phase panels -->
    <div id="author-panel" class="author-panel">

        <!-- RESEARCH panel -->
        <div id="panel-research" class="phase-panel">
            <div id="research-versions" class="version-list-area">
                <p class="text-muted">Select an assignment to see research versions.</p>
            </div>
            <div id="research-detail" class="phase-detail-area"></div>
        </div>

        <!-- DRAFTS panel -->
        <div id="panel-drafts" class="phase-panel" style="display:none;">
            <div id="drafts-versions" class="version-list-area">
                <p class="text-muted">Select an assignment to see draft versions.</p>
            </div>
            <div id="drafts-detail" class="phase-detail-area"></div>
        </div>

        <!-- FORMATS panel -->
        <div id="panel-formats" class="phase-panel" style="display:none;">
            <div id="formats-versions" class="version-list-area">
                <p class="text-muted">Select an assignment to see format versions.</p>
            </div>
            <div id="formats-detail" class="phase-detail-area"></div>
        </div>

    </div>

    <!-- Spinner -->
    <div id="author-spinner" class="author-loading" style="display:none;">
        <div class="spinner"></div>
        <p class="author-progress-text">Working...</p>
    </div>

</div>
{% endblock %}
