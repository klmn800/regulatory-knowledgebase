{% extends "base.html" %}

{% block content %}
<form hx-post="/ask"
      hx-target="#answer-area"
      hx-indicator="#ask-spinner"
      hx-disabled-elt=".ask-bar button"
      class="ask-form">

    <div class="ask-bar">
        <input type="text"
               name="question"
               placeholder="Ask a question about DTA policy..."
               autocomplete="off"
               autofocus>
        <button type="submit">Ask</button>
    </div>

    <div class="ask-options">
        <div class="source-checkboxes">
            <span class="option-label">Sources:</span>
            {% for key, src in SOURCES.items() %}
            <label class="checkbox-label">
                <input type="checkbox"
                       name="sources"
                       value="{{ key }}"
                       {{ 'checked' if key == DEFAULT_SOURCE }}>
                {{ src.short_label }}
            </label>
            {% endfor %}
        </div>

        <div class="program-filter">
            <span class="option-label">Program:</span>
            <select name="program_filter">
                <option value="all">All programs</option>
                <option value="snap">Exclude TAFDC & EAEDC</option>
                <option value="tafdc">Exclude SNAP & EAEDC</option>
                <option value="eaedc">Exclude SNAP & TAFDC</option>
                <option value="snap_only">SNAP only</option>
                <option value="tafdc_only">TAFDC only</option>
                <option value="eaedc_only">EAEDC only</option>
            </select>
        </div>

        <label class="checkbox-label deep-toggle">
            <input type="checkbox" name="deep" value="true">
            Deep analysis
        </label>
    </div>
</form>

<div id="answer-area">
    <div id="ask-spinner" class="htmx-indicator loading-state">
        <div class="spinner"></div>
        <p class="progress-text" data-steps='[
            "Searching policy sources...",
            "Reading through results...",
            "Analyzing relevance...",
            "Composing answer..."
        ]'>Searching policy sources...</p>
    </div>
</div>

<script>
document.addEventListener('htmx:beforeRequest', function(e) {
    if (e.detail.target && e.detail.target.id === 'answer-area') {
        var area = document.getElementById('answer-area');
        var prev = area.querySelector('.answer-container');
        if (prev) prev.remove();

        const el = document.querySelector('.progress-text');
        const steps = JSON.parse(el.dataset.steps);
        let i = 0;
        el.textContent = steps[0];
        el._interval = setInterval(function() {
            i++;
            if (i < steps.length) {
                el.style.opacity = 0;
                setTimeout(function() {
                    el.textContent = steps[i];
                    el.style.opacity = 1;
                }, 200);
            }
        }, 3000);
    }
});
document.addEventListener('htmx:afterRequest', function(e) {
    if (e.detail.target && e.detail.target.id === 'answer-area') {
        const el = document.querySelector('.progress-text');
        if (el && el._interval) clearInterval(el._interval);
    }
});
</script>
{% endblock %}
