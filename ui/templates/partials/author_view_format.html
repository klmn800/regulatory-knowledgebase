<div class="author-result-container">
    <!-- Version bar -->
    <div class="author-version-bar">
        <div class="version-nav">
            <span class="version-phase">Format</span>
            {% if view.total_versions > 1 %}
            <button class="btn-nav{% if not view.has_prev %} disabled{% endif %}"
                    {% if view.has_prev %}onclick="authorViewVersion('format', {{ view.prev_version }})"{% endif %}
                    title="Previous version">&lsaquo;</button>
            <span class="version-id">v{{ view.version_index }} of {{ view.total_versions }}</span>
            <button class="btn-nav{% if not view.has_next %} disabled{% endif %}"
                    {% if view.has_next %}onclick="authorViewVersion('format', {{ view.next_version }})"{% endif %}
                    title="Next version">&rsaquo;</button>
            {% elif not view.is_unversioned %}
            <span class="version-id">v1</span>
            {% else %}
            <span class="version-id">unversioned</span>
            {% endif %}
        </div>
        <button class="btn btn-sm btn-outline" onclick="authorRerun('format')">Run Again</button>
    </div>

    <div class="answer-card">
        {% if view.has_docx %}
        <div class="answer-body">
            <h3>.docx Generated</h3>
            <p><a href="/author/download/{{ name }}">Download {{ name }}.docx</a></p>
        </div>
        {% else %}
        <p class="text-muted">No .docx file found.</p>
        {% endif %}
    </div>
</div>
